modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_status_codes:
        - 200
      method: GET
      follow_redirects: true

  tcp_banner:
    prober: tcp
    timeout: 5s
    tcp:
      query_response:
        - expect: "^220"

  dns_example:
    prober: dns
    timeout: 5s
    dns:
      query_name: example.org
      query_type: A
      valid_rcodes:
        - NOERROR
